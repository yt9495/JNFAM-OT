<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JNFAM Overtime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f5; --paper:#ffffff; --ink:#16201c; --ink2:#4b5853; --muted:#7c8884; --line:#dfe3e0; --line2:#eef0ee;
  --pri:#0f5c4d; --pri-2:#e3efeb; --pri-ink:#ffffff;
  --amber:#a35a00; --amber-bg:#fff6e6; --amber-line:#f2d29b;
  --red:#b42318; --red-bg:#fdecea; --green:#16794a; --green-bg:#e7f5ec; --blue:#1d4ed8; --blue-bg:#e9effd;
  --grey-bg:#eef0ef; --violet:#6d28d9; --violet-bg:#f1ebfd;
  --r:10px; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans KR','IBM Plex Sans',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--pri)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:-.01em}
.brand b{font-size:17px}
.brand span{font-size:12px;color:var(--muted);font-weight:500}
.clock{font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--grey-bg);padding:3px 8px;border-radius:6px}
.clock.demo{background:var(--violet-bg);color:var(--violet)}
.sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}
.who{font-size:13px;color:var(--ink2)}
.tabs{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}

main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:19px;margin:4px 0 14px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.kv label,.field label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px;text-transform:none}
.kv div{font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.right{text-align:right}

/* ---------- controls ---------- */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],input[type=month],input[type=datetime-local],select,textarea{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 8px;min-height:34px;width:100%}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-2);border-color:var(--pri)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.no{color:var(--red);border-color:#f1c4bf}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- policy ---------- */
.policy{border:1px solid var(--amber-line);background:var(--amber-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;color:#5c3700}
.policy b.h{display:block;font-size:14.5px;color:var(--amber);margin-bottom:4px}
.policy ul{margin:4px 0 0 18px;padding:0}
.ack{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px dashed var(--amber-line);border-radius:8px;background:#fffdf8;margin:12px 0}
.ack input{margin-top:3px;width:18px;height:18px;flex:none}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:#f3f5f4;color:var(--ink2);font-weight:600;font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{background:#fafbfa;font-weight:700;border-top:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.lines td{padding:5px}
table.lines input,table.lines select{min-height:32px;padding:4px 6px}
table.lines td.calc{font-family:var(--mono);text-align:right;white-space:nowrap}
tr.dim td{opacity:.55}
table.t td.mono{white-space:nowrap}

/* ---------- badges ---------- */
.b{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b.PENDING{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.b.APPROVED{background:var(--blue-bg);color:var(--blue)}
.b.VERIFIED{background:var(--green-bg);color:var(--green)}
.b.CPA{background:var(--pri);color:#fff}
.b.REJECTED{background:var(--red-bg);color:var(--red)}
.b.EXPIRED{background:var(--grey-bg);color:var(--red);border-color:#f1c4bf}
.b.CANCELLED{background:var(--grey-bg);color:var(--muted)}
.b.OK{background:var(--green-bg);color:var(--green)}
.b.PARTIAL{background:var(--amber-bg);color:var(--amber)}
.b.NO_RECORD,.b.NO_OVERLAP{background:var(--red-bg);color:var(--red)}
.b.CHECK{background:var(--violet-bg);color:var(--violet)}
.b.MANUAL{background:var(--grey-bg);color:var(--ink2)}
.b.Y{background:var(--amber-bg);color:var(--amber)}

.empty{padding:28px;text-align:center;color:var(--muted)}
.pending-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.pending-card .when{font-family:var(--mono);font-size:15px;font-weight:600}
.countdown{font-size:12px;font-weight:700}
.countdown.soon{color:var(--red)} .countdown.ok{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600}

/* ---------- login ---------- */
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.login .card{padding:24px}
.login h1{font-size:21px;margin:0 0 2px}
.login .sub{color:var(--muted);margin-bottom:18px}
.field{margin-bottom:12px}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:90vw}
.toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,20,.38);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:620px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.demo-bar{background:var(--violet-bg);color:var(--violet);font-size:12.5px;padding:6px 16px;text-align:center;border-bottom:1px solid #ddd0fa}

/* ---------- CPA document ---------- */
.doc-wrap{background:#e9ecea;padding:18px;border-radius:10px;overflow-x:auto}
.doc{background:#fff;color:#111;width:8.5in;min-height:11in;margin:0 auto;padding:.6in .6in .5in;font-size:11.5px;line-height:1.45;box-shadow:0 2px 14px rgba(0,0,0,.12);font-family:var(--sans)}
.doc .lh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #0f5c4d;padding-bottom:8px;margin-bottom:14px}
.doc .lh .co{font-size:19px;font-weight:700;letter-spacing:.02em;color:#0f5c4d}
.doc .lh .ad{font-size:10.5px;color:#444;text-align:right}
.doc h1{font-size:17px;text-align:center;margin:6px 0 2px;letter-spacing:-.01em}
.doc .h1s{text-align:center;color:#555;font-size:11px;margin-bottom:12px}
.doc table{border-collapse:collapse;width:100%;margin-bottom:10px}
.doc th,.doc td{border:1px solid #b9c0bc;padding:4px 6px;vertical-align:top}
.doc th{background:#eef2f0;font-weight:600;text-align:left;font-size:10.5px}
.doc td.n,.doc th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .meta td:nth-child(odd){background:#f6f8f7;font-weight:600;width:18%}
.doc .pol{border:1.5px solid #a35a00;background:#fff8ec;padding:8px 10px;margin:10px 0 12px;font-size:11px}
.doc .pol b{color:#a35a00}
.doc h4{font-size:12px;margin:12px 0 5px;color:#0f5c4d}
.doc .tot td{font-weight:700;background:#f6f8f7}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px}
.doc .sig > div{border-top:1px solid #333;padding-top:4px;font-size:10.5px}
.doc .sig .sl{height:34px;border:0}
.doc table.det{table-layout:fixed}
.doc .foot{margin-top:16px;font-size:9.5px;color:#666;border-top:1px solid #ddd;padding-top:6px}
.doc .void{color:#b42318;font-weight:700;font-size:28px;text-align:center;border:3px solid #b42318;padding:4px;margin-bottom:10px}

@media (max-width:720px){
  .top-in{gap:8px}
  .doc{width:auto;min-height:0;padding:20px}
  .hide-m{display:none}
}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  body.printing > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .doc{box-shadow:none;margin:0;width:auto;min-height:0;padding:.5in}
  #printArea .doc table{page-break-inside:auto}
  #printArea .doc tr{page-break-inside:avoid}
}
#printArea{display:none}
.doc th.n{font-family:var(--sans);white-space:normal}

body.busy::before{content:'';position:fixed;top:0;left:0;height:3px;width:40%;background:var(--pri);z-index:200;animation:busy 1.1s ease-in-out infinite}
body.busy{cursor:progress}
@keyframes busy{0%{left:-40%}100%{left:100%}}

</style>
<script>
/* ============ CONFIG ============
 * API_URL: Apps Script 웹앱 배포 URL (…/exec).
 * 비워두면 데모 모드(브라우저 저장)로 동작합니다.
 * Leave empty for demo mode (browser storage).
 * ================================= */
window.OT_CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbzXcgMEndFYhA3C46Vn7iFqy-bUrr2N97rDapAvL0c5p-hfv2cAwJTZ8281Vthko_AVxA/exec' };
</script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
/* ============================================================
 * JNFAM Overtime — shared core (runs in browser demo AND Apps Script)
 * Pure logic + API handlers. Storage is injected via `store`.
 * ============================================================ */
var OTCore = (function () {
  'use strict';

  var VERSION = '1.0.0';

  var STATUS = {
    PENDING: 'PENDING', APPROVED: 'APPROVED', REJECTED: 'REJECTED',
    CANCELLED: 'CANCELLED', EXPIRED: 'EXPIRED', VERIFIED: 'VERIFIED', CPA: 'CPA', EXCLUDED: 'EXCLUDED'
  };

  var COLUMNS = {
    Employees: ['id', 'name', 'nameEn', 'timeClockName', 'email', 'dept', 'rate', 'roles', 'pin', 'active', 'schedStart', 'schedEnd'],
    Requests: ['id', 'groupId', 'empId', 'empName', 'date', 'start', 'end', 'breakMin', 'otType', 'description',
      'hours', 'premium', 'multiplier', 'status', 'ack', 'submittedAt', 'decidedAt', 'decidedBy', 'decidedByName',
      'decisionComment', 'actualIn', 'actualOut', 'actualHours', 'verifyResult', 'recognizedHours', 'rate', 'pay',
      'verifyNote', 'verifiedAt', 'verifiedBy', 'docId', 'lateEntry', 'lateReason', 'preApproved', 'source', 'preMethod', 'preBy'],
    Holidays: ['date', 'name'],
    Settings: ['key', 'value'],
    Docs: ['id', 'month', 'createdAt', 'createdBy', 'requestIds', 'totalHours', 'totalPay', 'status', 'note', 'periodFrom', 'periodTo'],
    Log: ['ts', 'user', 'action', 'target', 'detail']
  };

  var DEFAULT_SETTINGS = {
    companyName: 'JNF AM LLC',
    address: '825 Great SW Pkwy, South Fulton, GA 30336',
    phone: '770 727 8061',
    weekdayMultiplier: '1',
    premiumMultiplier: '1.5',
    premiumSaturday: 'TRUE',
    premiumSunday: 'FALSE',
    graceMinutes: '10',
    reviewMinutes: '15',
    employeeRequests: 'FALSE',
    startDate: '2026-09-25',
    cpaName: '',
    cpaEmail: '',
    adminEmail: '',
    ccEmail: '',
    appUrl: '',
    otTypes: '배관 작업|Piping work\n생산 작업|Production\n출하·선적|Shipping / Loading\n설비 보수|Maintenance\n재고·창고|Inventory / Warehouse\n기타|Other',
    timeClockSheetId: '1vkmFYoxJji64zWKL2d3-L6nQ-OoVfg-TAjGJY6HOPPg',
    timeClockSheetName: 'TimeLog'
  };

  /* ---------------- pure helpers ---------------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function round2(x) { return Math.round((Number(x) || 0) * 100) / 100; }
  function toMin(t) {
    if (!t) return NaN;
    var p = String(t).trim().split(':');
    return Number(p[0]) * 60 + Number(p[1] || 0) + Number(p[2] || 0) / 60;
  }
  function minToHHMM(m) {
    m = Math.round(m);
    var d = Math.floor(m / 1440); m = m - d * 1440;
    return pad(Math.floor(m / 60)) + ':' + pad(m % 60) + (d > 0 ? ' (+' + d + ')' : '');
  }
  function addDays(dateStr, n) {
    var d = new Date(dateStr + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function weekday(dateStr) { return new Date(dateStr + 'T12:00:00Z').getUTCDay(); } // 0=Sun
  function isTrue(v) { return v === true || String(v).toUpperCase() === 'TRUE' || v === '1' || v === 1; }

  /** Net OT hours for a window. end <= start means it crosses midnight. */
  function calcHours(start, end, breakMin) {
    var s = toMin(start), e = toMin(end);
    if (isNaN(s) || isNaN(e)) return 0;
    if (e <= s) e += 1440;
    return round2(Math.max(0, (e - s - (Number(breakMin) || 0))) / 60);
  }
  function windowOf(req) {
    var s = toMin(req.start), e = toMin(req.end);
    if (e <= s) e += 1440;
    return { s: s, e: e };
  }

  function holidaySet(holidays) {
    var m = {};
    (holidays || []).forEach(function (h) { if (h.date) m[String(h.date).slice(0, 10)] = h.name || true; });
    return m;
  }
  function isPremiumDay(dateStr, holidays, settings) {
    var wd = weekday(dateStr);
    if (wd === 6 && isTrue(settings.premiumSaturday)) return true;
    if (wd === 0 && isTrue(settings.premiumSunday)) return true;
    return !!holidaySet(holidays)[dateStr];
  }
  function multiplierFor(dateStr, holidays, settings) {
    return isPremiumDay(dateStr, holidays, settings) ? Number(settings.premiumMultiplier) || 1.5 : Number(settings.weekdayMultiplier) || 1;
  }

  /** US federal holidays (observed) for a year. */
  function federalHolidays(year) {
    function nth(month, dow, n) { // n=-1 last
      if (n > 0) {
        var d = new Date(Date.UTC(year, month, 1));
        var add = (dow - d.getUTCDay() + 7) % 7 + (n - 1) * 7;
        d.setUTCDate(1 + add); return d;
      }
      var last = new Date(Date.UTC(year, month + 1, 0));
      last.setUTCDate(last.getUTCDate() - ((last.getUTCDay() - dow + 7) % 7));
      return last;
    }
    function fixed(month, day) {
      var d = new Date(Date.UTC(year, month, day));
      if (d.getUTCDay() === 6) d.setUTCDate(d.getUTCDate() - 1);
      else if (d.getUTCDay() === 0) d.setUTCDate(d.getUTCDate() + 1);
      return d;
    }
    function fmt(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    return [
      [fixed(0, 1), "New Year's Day"], [nth(0, 1, 3), 'Martin Luther King Jr. Day'],
      [nth(1, 1, 3), "Presidents' Day"], [nth(4, 1, -1), 'Memorial Day'],
      [fixed(5, 19), 'Juneteenth'], [fixed(6, 4), 'Independence Day'],
      [nth(8, 1, 1), 'Labor Day'], [nth(9, 1, 2), 'Columbus Day'],
      [fixed(10, 11), 'Veterans Day'], [nth(10, 4, 4), 'Thanksgiving Day'],
      [fixed(11, 25), 'Christmas Day']
    ].map(function (x) { return { date: fmt(x[0]), name: x[1] }; });
  }

  /**
   * Match Time Clock punches against an approved OT window.
   * punches: [{date:'YYYY-MM-DD', time:'H:MM:SS', type:'IN'|'OUT'}] for ONE employee.
   */
  var MAX_SHIFT = 18 * 60; // an IN/OUT pair longer than this is treated as a missing punch
  function buildIntervals(punches, date) {
    var d0 = date, d1 = addDays(date, 1);
    var pts = (punches || []).filter(function (p) { return p.date === d0 || p.date === d1; })
      .map(function (p) {
        return { m: (p.date === d0 ? 0 : 1440) + toMin(p.time), type: String(p.type).toUpperCase() };
      }).filter(function (p) { return !isNaN(p.m); })
      .sort(function (a, b) { return a.m - b.m; });
    var intervals = [], anomalies = [], open = null;
    pts.forEach(function (p) {
      if (p.type === 'IN') {
        if (open) {
          if (p.m - open.m > MAX_SHIFT || p.m >= 1440) { if (open.m < 1440) anomalies.push('MISSING_OUT'); open = p; }
          else if (open.m < 1440) anomalies.push('DOUBLE_IN');
        } else open = p;
      } else if (p.type === 'OUT') {
        if (open && p.m - open.m <= MAX_SHIFT) { intervals.push({ s: open.m, e: p.m }); open = null; }
        else if (open) { if (open.m < 1440) anomalies.push('MISSING_OUT'); open = null; }
        else if (p.m < 1440) anomalies.push('OUT_WITHOUT_IN');
      }
    });
    var openIn = open && open.m < 1440 ? open.m : null;
    if (open && open.m < 1440 && anomalies.indexOf('MISSING_OUT') < 0) anomalies.push('MISSING_OUT');
    // keep only intervals that start on the date
    intervals = intervals.filter(function (iv) { return iv.s < 1440; });
    return { intervals: intervals, anomalies: anomalies, openIn: openIn };
  }

  function matchPunches(punches, req, graceMinutes) {
    var b = buildIntervals(punches, req.date);
    var intervals = b.intervals, anomalies = b.anomalies;

    var w = windowOf(req);
    var overlap = 0;
    intervals.forEach(function (iv) { overlap += Math.max(0, Math.min(iv.e, w.e) - Math.max(iv.s, w.s)); });

    var gross = w.e - w.s;
    var net = calcHours(req.start, req.end, req.breakMin);
    var grace = Number(graceMinutes) || 0;
    var result, recognized;
    if (!intervals.length && !anomalies.length) { result = 'NO_RECORD'; recognized = 0; }
    else if (overlap >= gross - grace) { result = 'OK'; recognized = net; }
    else if (overlap <= 0) { result = 'NO_OVERLAP'; recognized = 0; }
    else { result = 'PARTIAL'; recognized = round2(Math.max(0, Math.min(net, (overlap - (Number(req.breakMin) || 0)) / 60))); }
    if (anomalies.length && result === 'OK') result = 'CHECK';
    else if (anomalies.length && result !== 'NO_RECORD') result = result === 'PARTIAL' ? 'PARTIAL' : 'CHECK';
    if (anomalies.indexOf('MISSING_OUT') >= 0) result = 'CHECK';

    var actualIn = intervals.length ? minToHHMM(intervals[0].s) : '';
    var actualOut = intervals.length ? minToHHMM(intervals[intervals.length - 1].e) : '';
    return {
      intervals: intervals.map(function (iv) { return minToHHMM(iv.s) + '–' + minToHHMM(iv.e); }),
      actualIn: actualIn, actualOut: actualOut,
      overlapHours: round2(overlap / 60),
      anomalies: anomalies, result: result, recognizedHours: recognized, approvedHours: net
    };
  }

  function hhmm(m) { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }

  /**
   * OT candidates straight from the Time Clock (one row per employee-day).
   * Weekday: time after scheduled end (+ time before schedStart-60). Off day / holiday: all worked time.
   */
  function clockCandidates(punchesByEmp, employees, holidays, settings, month) {
    var min = Number(settings.reviewMinutes) || 15;
    var out = [];
    employees.forEach(function (emp) {
      var ps = punchesByEmp[emp.id] || [];
      var dates = {};
      ps.forEach(function (p) { if (String(p.date).slice(0, 7) === month && (!settings.startDate || p.date >= settings.startDate)) dates[p.date] = 1; });
      Object.keys(dates).sort().forEach(function (date) {
        var b = buildIntervals(ps, date), ivs = b.intervals;
        var wd = weekday(date);
        var offDay = wd === 0 || wd === 6 || isPremiumDay(date, holidays, settings);
        var schedS = toMin(emp.schedStart || '09:00'), schedE = toMin(emp.schedEnd || '17:00');
        var segs = [];
        ivs.forEach(function (iv) {
          if (offDay) { segs.push({ s: iv.s, e: iv.e }); return; }
          if (iv.s < schedS - 60) segs.push({ s: iv.s, e: Math.min(iv.e, schedS - 60) });
          if (iv.e > schedE) segs.push({ s: Math.max(iv.s, schedE), e: iv.e });
        });
        var mins = segs.reduce(function (a, x) { return a + Math.max(0, x.e - x.s); }, 0);
        if (mins < min && !b.anomalies.length) return;
        if (!ivs.length && !b.anomalies.length) return;
        var s0 = segs.length ? Math.min.apply(null, segs.map(function (x) { return x.s; })) : 0;
        var e0 = segs.length ? Math.max.apply(null, segs.map(function (x) { return x.e; })) : 0;
        out.push({
          key: emp.id + '|' + date, empId: emp.id, empName: emp.name, date: date, offDay: offDay,
          sched: (emp.schedStart || '09:00') + '–' + (emp.schedEnd || '17:00'),
          punches: ivs.map(function (iv) { return minToHHMM(iv.s) + '–' + minToHHMM(iv.e); }).concat(b.openIn != null ? [minToHHMM(b.openIn) + '–?'] : []).join(', '),
          anomalies: b.anomalies,
          otStart: segs.length ? hhmm(s0) : '', otEnd: segs.length ? hhmm(e0) : '',
          otLabel: segs.map(function (x) { return minToHHMM(x.s) + '–' + minToHHMM(x.e); }).join(', '),
          otHours: round2(mins / 60)
        });
      });
    });
    return out;
  }

  /**
   * Extra time in Time Clock NOT covered by any approved request (not recognized).
   * Weekday: time worked after scheduled end (and before schedStart - 60min).
   * Premium day / weekend: all worked time.
   */
  function unapprovedExtra(punchesByEmp, employees, requests, holidays, settings, month) {
    var grace = Number(settings.reviewMinutes) || 15;
    var out = [];
    employees.forEach(function (emp) {
      var ps = punchesByEmp[emp.id] || [];
      var dates = {};
      ps.forEach(function (p) { if (String(p.date).slice(0, 7) === month) dates[p.date] = 1; });
      Object.keys(dates).sort().forEach(function (date) {
        var ivs = buildIntervals(ps, date).intervals;
        var label = ivs.map(function (iv) { return minToHHMM(iv.s) + '–' + minToHHMM(iv.e); }).join(', ');
        if (!ivs.length) return;
        var wd = weekday(date);
        var offDay = wd === 0 || wd === 6 || isPremiumDay(date, holidays, settings);
        var schedS = toMin(emp.schedStart || '09:00'), schedE = toMin(emp.schedEnd || '17:00');
        var extra = [];
        ivs.forEach(function (iv) {
          if (offDay) { extra.push({ s: iv.s, e: iv.e }); return; }
          if (iv.e > schedE) extra.push({ s: Math.max(iv.s, schedE), e: iv.e });
          if (iv.s < schedS - 60) extra.push({ s: iv.s, e: Math.min(iv.e, schedS - 60) });
        });
        // subtract windows of approved/verified/cpa requests
        var covered = requests.filter(function (r) {
          return r.empId === emp.id && r.date === date && [STATUS.APPROVED, STATUS.VERIFIED, STATUS.CPA].indexOf(r.status) >= 0;
        }).map(windowOf);
        var mins = 0;
        extra.forEach(function (x) {
          var segs = [x];
          covered.forEach(function (c) {
            var next = [];
            segs.forEach(function (sg) {
              if (c.e <= sg.s || c.s >= sg.e) { next.push(sg); return; }
              if (c.s > sg.s) next.push({ s: sg.s, e: c.s });
              if (c.e < sg.e) next.push({ s: c.e, e: sg.e });
            });
            segs = next;
          });
          segs.forEach(function (sg) { mins += Math.max(0, sg.e - sg.s); });
        });
        if (mins > grace) {
          out.push({
            empId: emp.id, empName: emp.name, date: date, offDay: offDay,
            punches: label, extraHours: round2(mins / 60),
            hasRequest: requests.some(function (r) { return r.empId === emp.id && r.date === date; })
          });
        }
      });
    });
    return out;
  }

  /* ---------------- API ---------------- */
  function create(store) {
    function err(code, msg) { var e = new Error(msg || code); e.code = code; throw e; }

    function settings() {
      var s = {};
      Object.keys(DEFAULT_SETTINGS).forEach(function (k) { s[k] = DEFAULT_SETTINGS[k]; });

        { id: 'E005', name: 'JOHNETTE', nameEn: 'JOHNETTE K', timeClockName: 'JOHNETTE', email: '', dept: 'Production', rate: '30', roles: 'employee', pin: '0000', active: 'TRUE', schedStart: '08:00', schedEnd: '16:00' }

    function auth(p) {
      var empId = p && p.token ? store.sessionGet(p.token) : null;

    }

    function publicEmp(e, full) {
      var o = { id: e.id, name: e.name, nameEn: e.nameEn, dept: e.dept, roles: e.roles, active: e.active, schedStart: e.schedStart, schedEnd: e.schedEnd };
      if (full) { o.timeClockName = e.timeClockName; o.email = e.email; o.rate = e.rate; o.hasPin = !!e.pin; }

    }

    function expireStale() {
      var now = store.nowET();
      store.read('Requests').forEach(function (r) {
        if ((r.status === STATUS.PENDING) && (r.date + 'T' + r.start) <= now.slice(0, 16)) {

    function mailApprovers(reqs, user, s) {

      }).join('');
      var html = '<div style="font-family:Arial,sans-serif;font-size:14px">'

        + '<table border="1" cellpadding="6" style="border-collapse:collapse"><tr><th>Date</th><th>Time</th><th>Hours</th><th>Type</th><th>Description</th></tr>' + rows + '</table>'
        + (reqs.some(function (r) { return r.lateEntry === 'Y'; }) ? '<p style="color:#b42318">⚠ 시작 시각 이후 등록된 사후 신청이 포함되어 있습니다. / Includes entries submitted after the start time (post-entry).</p>' : '')
        + '<p style="color:#b45309">※ 시작 시각 이후 승인 시 "사후 승인"으로 표시됩니다. / Approvals after the start time are flagged as post-approved.</p>'
        + (s.appUrl ? '<p><a href="' + s.appUrl + '">' + s.appUrl + '</a></p>' : '') + '</div>';
      store.sendMail(to.join(','), '[JNFAM OT] 승인 요청 / Approval request — ' + (user.nameEn || user.name), html, s.ccEmail);
    }
    function mailApplicant(r, decider, s) {
      var emp = employees().filter(function (e) { return e.id === r.empId; })[0];
      if (!emp || !emp.email) return;
      var ok = r.status === STATUS.APPROVED;
      var html = '<div style="font-family:Arial,sans-serif;font-size:14px">'
        + '<p>오버타임 신청이 <b>' + (ok ? '승인' : '반려') + '</b>되었습니다. / Your overtime request was <b>' + (ok ? 'APPROVED' : 'REJECTED') + '</b>.</p>'
        + '<p>' + r.date + ' ' + r.start + '–' + r.end + ' (' + r.hours + 'h) · ' + esc(r.otType) + '</p>'
        + (ok && r.preApproved === 'N' ? '<p style="color:#b42318">⚠ 사후 승인 / Post-approved (approved after start)</p>' : '')
        + (r.decisionComment ? '<p>Comment: ' + esc(r.decisionComment) + '</p>' : '')
        + '<p>Approver: ' + esc(decider.nameEn || decider.name) + ' · ' + r.decidedAt + ' ET</p></div>';
      store.sendMail(emp.email, '[JNFAM OT] ' + (ok ? '승인 Approved' : '반려 Rejected') + ' — ' + r.date, html, '');
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function punchesFor(from, to) {
      var emps = employees();
      var byName = {};
      emps.forEach(function (e) { if (e.timeClockName) byName[String(e.timeClockName).trim()] = e.id; });
      var raw = store.timelog(from, addDays(to, 1));
      var by = {};
      raw.forEach(function (p) {
        var id = byName[String(p.name).trim()];
        if (!id) return;
        (by[id] = by[id] || []).push({ date: p.date, time: p.time, type: p.type });
      });
      return by;
    }

    var handlers = {
      ping: function () { return { ok: true, version: VERSION, nowET: store.nowET() }; },

      loginList: function () {
        seedIfEmpty();
        return { employees: employees().filter(function (e) { return isTrue(e.active); }).map(function (e) { return { id: e.id, name: e.name, nameEn: e.nameEn }; }) };
      },

      login: function (p) {
        seedIfEmpty();
        var u = employees().filter(function (e) { return e.id === p.empId && isTrue(e.active); })[0];
        if (!u || String(u.pin) !== String(p.pin)) err('LOGIN', 'Invalid ID or PIN');
        var token = store.uuid();
        store.sessionSet(token, u.id);
        log(u, 'login');
        return { token: token };
      },

      bootstrap: function (p) {
        var u = auth(p);
        var isAdmin = has(u, 'admin'), isApprover = has(u, 'approver') || isAdmin;
        var reqs = store.read('Requests');
        if (!isApprover) reqs = reqs.filter(function (r) { return r.empId === u.id; });
        if (!isAdmin) reqs = reqs.map(function (r) { if (r.empId !== u.id) { var c = {}; for (var k in r) c[k] = r[k]; c.rate = ''; c.pay = ''; return c; } return r; });
        return {
          user: publicEmp(u, true),
          roles: rolesOf(u),
          employees: employees().map(function (e) { return publicEmp(e, isAdmin); }),
          settings: settings(),
          holidays: holidays(),
          requests: reqs,
          docs: isAdmin ? store.read('Docs') : [],
          nowET: store.nowET()
        };
      },

      submit: function (p) {
        var u = auth(p);
        if (!p.ack) err('ACK', 'Pre-approval policy must be acknowledged');
        var lines = p.lines || [];
        if (!lines.length) err('EMPTY', 'No lines');
        var s = settings(), hol = holidays(), now = store.nowET();
        var empId = u.id;
        var mine = store.read('Requests').filter(function (r) {
          return r.empId === empId && [STATUS.REJECTED, STATUS.CANCELLED, STATUS.EXPIRED].indexOf(r.status) < 0;
        });
        var groupId = 'G' + now.replace(/\D/g, '').slice(2, 14);
        var created = [];
        return store.lock(function () {
          var seq = store.read('Requests').length;
          lines.forEach(function (l, i) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(l.date || '')) err('DATE', 'Invalid date (line ' + (i + 1) + ')');
            if (!/^\d{1,2}:\d{2}$/.test(l.start || '') || !/^\d{1,2}:\d{2}$/.test(l.end || '')) err('TIME', 'Invalid time (line ' + (i + 1) + ')');
            var start = pad(Math.floor(toMin(l.start) / 60)) + ':' + pad(toMin(l.start) % 60);
            var end = pad(Math.floor(toMin(l.end) / 60)) + ':' + pad(toMin(l.end) % 60);
            var late = (l.date + 'T' + start) <= now.slice(0, 16);
            if (late && !String(l.lateReason || '').trim()) err('LATE_REASON', 'LATE_REASON:' + l.date + ' ' + start);
            var hours = calcHours(start, end, l.breakMin);
            if (hours <= 0) err('HOURS', 'OT hours must be > 0 (line ' + (i + 1) + ')');
            if (hours > 16) err('HOURS', 'OT hours too long (line ' + (i + 1) + ')');
            if (!String(l.description || '').trim()) err('DESC', 'Description required (line ' + (i + 1) + ')');
            var w = windowOf({ start: start, end: end });
            mine.concat(created).forEach(function (r) {
              if (r.date !== l.date) return;
              var o = windowOf(r);
              if (w.s < o.e && o.s < w.e) err('OVERLAP', 'OVERLAP:' + l.date);
            });
            seq++;
            var r = {
              id: 'OT' + now.slice(2, 4) + now.slice(5, 7) + '-' + ('000' + seq).slice(-4) + '-' + store.uuid().slice(0, 4).toUpperCase(),
              groupId: groupId, empId: empId, empName: u.name, date: l.date, start: start, end: end,
              breakMin: String(Number(l.breakMin) || 0), otType: String(l.otType || ''), description: String(l.description || '').trim(),
              hours: String(hours), premium: isPremiumDay(l.date, hol, s) ? 'Y' : 'N', multiplier: String(multiplierFor(l.date, hol, s)),
              status: STATUS.PENDING, ack: 'TRUE', submittedAt: now,
              lateEntry: late ? 'Y' : 'N', lateReason: late ? String(l.lateReason).trim() : ''
            };
            created.push(r);
          });
          created.forEach(function (r) { store.append('Requests', r); });
          log(u, 'submit', groupId, created.map(function (r) { return r.id; }).join(','));
          try { mailApprovers(created, u, s); } catch (e) { log(u, 'mail-error', groupId, String(e)); }
          return { created: created };
        });
      },

      cancel: function (p) {
        var u = auth(p);
        return store.lock(function () {
          var r = store.read('Requests').filter(function (x) { return x.id === p.id; })[0];
          if (!r) err('NOTFOUND');
          if (r.empId !== u.id && !has(u, 'admin')) err('FORBIDDEN');
          var now = store.nowET();
          if (!(r.status === STATUS.PENDING || (r.status === STATUS.APPROVED && ((r.date + 'T' + r.start) > now.slice(0, 16) || has(u, 'admin'))))) err('STATE', 'Cannot cancel in this state');
          r.status = STATUS.CANCELLED;
          r.decisionComment = (r.decisionComment ? r.decisionComment + ' / ' : '') + 'Cancelled by ' + u.name + ' ' + now;
          store.upsert('Requests', 'id', r);
          log(u, 'cancel', r.id);
          return { request: r };
        });
      },

      decide: function (p) {
        var u = auth(p);
        need(u, 'approver');
        var s = settings();
        return store.lock(function () {
          var r = store.read('Requests').filter(function (x) { return x.id === p.id; })[0];
          if (!r) err('NOTFOUND');
          if (r.empId === u.id) err('SELF', 'Self-approval is not allowed');
          if (r.status !== STATUS.PENDING) err('STATE', 'Already processed: ' + r.status);
          var now = store.nowET();
          if (p.decision === 'approve') {
            r.status = STATUS.APPROVED;
            r.preApproved = (r.date + 'T' + r.start) > now.slice(0, 16) ? 'Y' : 'N';
          } else {
            if (!String(p.comment || '').trim()) err('COMMENT', 'Reason required');
            r.status = STATUS.REJECTED;
          }
          r.decidedAt = now; r.decidedBy = u.id; r.decidedByName = u.nameEn || u.name;
          r.decisionComment = String(p.comment || '');
          store.upsert('Requests', 'id', r);
          log(u, p.decision, r.id);
          try { mailApplicant(r, u, s); } catch (e) { log(u, 'mail-error', r.id, String(e)); }
          return { request: r };
        });
      },

      /** Suggested verification results for approved requests in a month + unapproved extra time */
      verifyPreview: function (p) {
        var u = auth(p);
        need(u, 'admin');
        var from, to;
        if (p.from && p.to) { from = p.from; to = p.to; }
        else { from = p.month + '-01'; to = addDays(addDays(p.month + '-28', 4).slice(0, 7) + '-01', -1); }
        if (from > to) err('PERIOD', 'Invalid period');
        var months = [];
        for (var mm = from.slice(0, 7); mm <= to.slice(0, 7); mm = addDays(mm + '-28', 4).slice(0, 7)) months.push(mm);
        var s = settings(), hol = holidays();
        var punches = punchesFor(from, to);
        var inR = function (d) { return d >= from && d <= to; };
        var reqs = store.read('Requests').filter(function (r) { return inR(String(r.date)); });
        var rows = reqs.filter(function (r) { return [STATUS.APPROVED, STATUS.VERIFIED, STATUS.CPA].indexOf(r.status) >= 0; })
          .map(function (r) { return { id: r.id, match: matchPunches(punches[r.empId] || [], r, s.graceMinutes) }; });
        var emps = employees().filter(function (e) { return isTrue(e.active) && e.timeClockName; });
        var cands = [], unap = [];
        months.forEach(function (m) {
          cands = cands.concat(clockCandidates(punches, emps, hol, s, m));
          unap = unap.concat(unapprovedExtra(punches, emps, reqs, hol, s, m));
        });
        return {
          from: from, to: to,
          rows: rows,
          unapproved: unap.filter(function (x) { return inR(x.date); }),
          candidates: cands.filter(function (c) { return inR(c.date); }).map(function (c) {
            c.records = reqs.filter(function (r) { return r.empId === c.empId && r.date === c.date && [STATUS.REJECTED, STATUS.CANCELLED, STATUS.EXPIRED].indexOf(r.status) < 0; })
              .map(function (r) { return r.id; });
            return c;
          }).sort(function (a, b) { return (a.empId + a.date).localeCompare(b.empId + b.date); }),
          punchCount: Object.keys(punches).reduce(function (a, k) { return a + punches[k].filter(function (x) { return inR(x.date); }).length; }, 0)
        };
      },

      verify: function (p) {
        var u = auth(p);
        need(u, 'admin');
        var items = p.items || [];
        return store.lock(function () {
          var all = store.read('Requests'), emps = employees(), now = store.nowET(), done = [];
          items.forEach(function (it) {
            var r = all.filter(function (x) { return x.id === it.id; })[0];
            if (!r) err('NOTFOUND', it.id);
            if ([STATUS.APPROVED, STATUS.VERIFIED].indexOf(r.status) < 0) err('STATE', r.id + ': ' + r.status);
            if ((r.date + 'T' + r.end) > now.slice(0, 16) && windowOf(r).e < 1440) err('FUTURE', 'FUTURE:' + r.id);
            var rec = round2(it.recognizedHours);

      call('saveSettings', { settings: o }).then(function () { toast(t('saved')); return load(); }).catch(function (e) { toast(errMsg(e), true); });
    };
    $('#addEmp').onclick = function () { empModal({ id: '', name: '', nameEn: '', timeClockName: '', dept: '', email: '', rate: '', roles: 'employee', active: 'TRUE', schedStart: '09:00', schedEnd: '17:00' }); };
    $$('[data-edit]', el).forEach(function (b) { b.onclick = function () { empModal(empById(b.getAttribute('data-edit'))); }; });
  }
  function empModal(e) {
    var roles = String(e.roles || '').split(/[,\s]+/);
    function f(k, l, type) { return '<div class="field"><label>' + esc(l) + '</label><input type="' + (type || 'text') + '" data-e="' + k + '" value="' + esc(e[k] == null ? '' : e[k]) + '"></div>'; }
    modal('<h3>' + (e.id ? esc(e.id) : t('addEmp')) + '</h3><div class="grid">' +
      f('name', t('empName')) + f('nameEn', 'English') + f('timeClockName', t('tcName')) + f('dept', t('dept')) + f('email', t('email'), 'email') + f('rate', t('rate'), 'number') +
      f('schedStart', t('start'), 'time') + f('schedEnd', t('end'), 'time') + f('pin', t('newPin'), 'password') +
      '<div class="field"><label>' + t('active') + '</label><select data-e="active"><option value="TRUE">Yes</option><option value="FALSE"' + (C.isTrue(e.active) ? '' : ' selected') + '>No</option></select></div></div>' +
      '<div class="field"><label>' + t('roles') + '</label><div class="row">' + [['employee', t('roleEmployee')], ['approver', t('roleApprover')], ['admin', t('roleAdmin')]].map(function (r) {
        return '<label class="row" style="gap:5px"><input type="checkbox" data-role="' + r[0] + '"' + (roles.indexOf(r[0]) >= 0 ? ' checked' : '') + '>' + r[1] + '</label>';
      }).join('') + '</div></div>' +
      '<p class="small muted">' + esc(t('tcName')) + ': ' + (S.lang === 'ko' ? '출퇴근 기록 시트의 "이름 (Name)"과 정확히 같아야 대조됩니다.' : 'Must exactly match "이름 (Name)" in the Time Clock sheet.') + '</p>' +
      '<div class="acts"><button class="btn" data-x>' + t('close') + '</button><button class="btn pri" data-ok>' + t('save') + '</button></div>', function (m, close) {
        $('[data-x]', m).onclick = close;
        $('[data-ok]', m).onclick = function () {
          var o = { id: e.id };
          $$('[data-e]', m).forEach(function (i) { o[i.getAttribute('data-e')] = i.value; });
          o.roles = $$('[data-role]', m).filter(function (c) { return c.checked; }).map(function (c) { return c.getAttribute('data-role'); }).join(',');
          if (!o.name) return toast(t('empName') + '?', true);
          call('saveEmployee', { emp: o }).then(function () { toast(t('saved')); close(); return load(); }).catch(function (er) { toast(errMsg(er), true); });
        };
      });
  }

  /* ================= DEMO ================= */
  function viewDemo(el) {
    var ob = demoStore.demo.outbox();
    var imp = demoStore.demo.hasImport();
    el.innerHTML = '<h2>' + t('tDemo') + '</h2>' +
      '<div class="card"><h3>' + t('demoClock') + '</h3><div class="row"><input type="datetime-local" id="dmNow" value="' + nowET().slice(0, 16) + '" style="width:230px"><button class="btn pri" id="dmSet">' + t('setClock') + '</button><button class="btn" id="dmReal">' + t('resetClock') + '</button></div>' +
      '<p class="small muted">' + (S.lang === 'ko' ? '시계를 앞뒤로 옮겨 "시작 전 신청 → 승인 → 근무 후 검증" 흐름을 시험하세요. 승인 대기 상태로 시작 시각이 지나면 자동 만료됩니다.' : 'Move the clock to test "request before start → approve → verify after work". Pending requests expire once their start time passes.') + '</p></div>' +
      '<div class="card"><h3>' + t('scenario') + '</h3><p class="small muted">' + esc(t('scenarioHelp')) + '</p><button class="btn" id="dmScen">' + t('scenario') + '</button></div>' +
      '<div class="card"><h3>' + t('importCsv') + (imp ? ' <span class="b OK">' + imp + '</span>' : '') + '</h3><p class="small muted">' + esc(t('importHelp')) + '</p><textarea id="dmCsv" rows="5" placeholder="기록ID (Record ID),날짜 ET (Date),요일 (Day),이름 (Name),구분 (Type),시각 ET (Time),..."></textarea>' +
      '<div class="row" style="margin-top:8px"><input type="file" id="dmFile" accept=".csv,text/csv" style="max-width:260px"><button class="btn pri" id="dmImp">' + t('importBtn') + '</button><button class="btn" id="dmClr">' + t('clearImport') + '</button></div></div>' +
      '<div class="card"><h3>' + t('outbox') + ' (' + ob.length + ')</h3>' + (ob.length ? ob.map(function (m) {
        return '<details style="border-top:1px solid var(--line2);padding:6px 0"><summary><span class="mono small">' + fmtTs(m.at) + '</span> → <b>' + esc(m.to) + '</b> · ' + esc(m.subject) + '</summary><div style="padding:8px;background:#fafbfa;border-radius:6px;margin-top:6px">' + m.html + '</div></details>';
      }).join('') : '<p class="small muted">' + (S.lang === 'ko' ? '관리 › 직원 관리에서 이메일을 입력하면 알림 메일이 여기에 표시됩니다.' : 'Add emails in Admin › Employees to see notifications here.') + '</p>') + '</div>' +
      '<div class="card"><button class="btn no" id="dmReset">' + t('resetAll') + '</button></div>';
    $('#dmSet').onclick = function () { demoStore.demo.setNow($('#dmNow').value); load(); };
    $('#dmReal').onclick = function () { demoStore.demo.resetClock(); load(); };
    $('#dmFile').onchange = function () { var f = this.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function () { $('#dmCsv').value = rd.result; }; rd.readAsText(f); };
    $('#dmImp').onclick = function () { try { var n = demoStore.demo.importCsv($('#dmCsv').value); toast(t('loadedPunches', { n: n })); S.verify = null; render(); } catch (e) { toast(e.message, true); } };
    $('#dmClr').onclick = function () { demoStore.demo.clearImport(); S.verify = null; render(); };
    $('#dmReset').onclick = function () {
      var b = this; if (b.getAttribute('data-armed') !== '1') { b.setAttribute('data-armed', '1'); b.textContent = t('confirmReset'); return; }
      demoStore.demo.resetAll(); S.verify = null; logout();
    };
    $('#dmScen').onclick = function () { makeScenario().then(function () { toast('OK'); return load(); }).catch(function (e) { toast(errMsg(e), true); }); };
  }

  /** Builds requests through the real API by moving the virtual clock back before each start. */
  function makeScenario() {
    var realNow = nowET();
    var base = prevMonth(realNow.slice(0, 7));
    var plan = [
      ['E001', base + '-06', '17:00', '19:30', 0, '배관 작업|Piping work', 'Line 2 piping replacement'],
      ['E002', base + '-08', '17:00', '20:00', 0, '출하·선적|Shipping / Loading', 'HF ISO tank loading — late truck'],
      ['E003', base + '-13', '17:00', '19:00', 0, '설비 보수|Maintenance', 'Scrubber pump PM'],
      ['E004', base + '-14', '16:00', '18:00', 0, '생산 작업|Production', 'KOH batch finish'],
      ['E001', base + '-17', '09:00', '15:00', 30, '재고·창고|Inventory / Warehouse', 'Saturday cycle count'],
      ['E005', base + '-21', '16:00', '19:00', 0, '생산 작업|Production', 'Urgent repack order'],
      ['E002', base + '-27', '17:00', '18:30', 0, '출하·선적|Shipping / Loading', 'Export docs + loading']
    ];
    var adminTok, chain = call('login', { empId: 'admin', pin: '1234' }).then(function (d) { adminTok = d.token; });
    plan.forEach(function (p) {
      var d = p[1];
      // ensure Saturday item is a Saturday
      if (p[4] === 30) { while (C.weekday(d) !== 6) d = C.addDays(d, 1); }
      else { while (C.weekday(d) === 0 || C.weekday(d) === 6) d = C.addDays(d, 1); }
      chain = chain.then(function () {
        demoStore.demo.setNow(C.addDays(d, -1) + 'T10:00');
        return call('login', { empId: p[0], pin: '0000' });
      }).then(function (lg) {
        return call('submit', { token: lg.token, ack: true, lines: [{ date: d, start: p[2], end: p[3], breakMin: p[4], otType: p[5], description: p[6] }] });
      }).then(function (r) {
        demoStore.demo.setNow(C.addDays(d, -1) + 'T14:30');
        return call('decide', { token: adminTok, id: r.created[0].id, decision: 'approve', comment: '' });
      }).catch(function () { });
    });
    // one post-entry: submitted and approved after the work was done
    chain = chain.then(function () {
      var d = base + '-22'; while (C.weekday(d) === 0 || C.weekday(d) === 6) d = C.addDays(d, 1);
      demoStore.demo.setNow(d + 'T20:30');
      return call('login', { empId: 'E003', pin: '0000' }).then(function (lg) {
        return call('submit', { token: lg.token, ack: true, lines: [{ date: d, start: '17:00', end: '19:00', breakMin: 0, otType: '기타|Other', description: 'Emergency tank leak response', lateReason: 'Verbal approval by manager at 16:40 (phone)' }] });
      }).then(function (r) {
        demoStore.demo.setNow(C.addDays(d, 1) + 'T09:00');
        return call('decide', { token: adminTok, id: r.created[0].id, decision: 'approve', comment: 'Confirmed verbal approval' });
      });
    }).catch(function () { });
    return chain.then(function () { demoStore.demo.setNow(realNow.slice(0, 16)); });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
